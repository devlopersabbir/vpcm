name: Snapcraft Promote

on:
  workflow_dispatch:
    inputs:
      from_channel:
        description: 'Source channel (e.g. edge, candidate)'
        required: true
        default: 'edge'
        type: string
      to_channel:
        description: 'Target channel (e.g. candidate, beta, stable)'
        required: true
        type: choice
        options:
          - candidate
          - beta
          - stable
      revision:
        description: 'Snapcraft numeric revision number (optional, leave BLANK to promote latest build)'
        required: false
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Promote Revision
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          FROM="${{ github.event.inputs.from_channel }}"
          TO="${{ github.event.inputs.to_channel }}"
          REV="${{ github.event.inputs.revision }}"
          
          if [ -n "$REV" ]; then
            echo "Promoting specific revision $REV from $FROM to $TO..."
            snapcraft promote vpsm --revision="$REV" --from-channel="$FROM" --to-channel="$TO"
          else
            echo "Promoting channel $FROM to $TO..."
            snapcraft promote vpsm --from-channel="$FROM" --to-channel="$TO"
          fi
