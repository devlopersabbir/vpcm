name: Snapcraft Promote

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Snapcraft numeric revision number (e.g., 5, 12 - check snapcraft status/build output)'
        required: true
        type: string
      to_channel:
        description: 'Target channel'
        required: true
        type: choice
        options:
          - beta
          - candidate
          - stable

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Promote Revision
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          snapcraft promote vpsm ${{ github.event.inputs.revision }} ${{ github.event.inputs.to_channel }}

