name: Dev Build Check

on:
  push:
    branches:
      - dev

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Cross-Platform CLI Binaries
        run: |
          targets=("darwin/amd64" "darwin/arm64" "linux/amd64" "linux/arm64" "windows/amd64" "windows/386")
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch <<< "$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            echo "Checking build for $goos/$goarch..."
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "vpsm-${goos}-${goarch}${ext}" ./cmd/vpsm
            rm "vpsm-${goos}-${goarch}${ext}"
          done

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Check Wails Desktop Build
        run: |
          cd app/vpsm-desktop
          ~/go/bin/wails build -tags webkit2gtk_4_1
