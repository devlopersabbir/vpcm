name: Snapcraft Publish Edge

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        shell: bash
        run: |
          cd app/vpsm-desktop
          ~/go/bin/wails build -tags webkit2_41

      - name: Inject Version into snapcraft.yaml
        run: |
          CURRENT_VERSION=$(grep 'var Version =' internal/version/version.go | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          sed -i "s/version: 'latest'/version: '$CURRENT_VERSION'/g" snap/snapcraft.yaml

      - name: Build Snap Package
        uses: snapcore/action-build@v1
        id: build

      - name: Upload to Snap Store (Edge)
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          snapcraft upload --release=edge ${{ steps.build.outputs.snap }}
