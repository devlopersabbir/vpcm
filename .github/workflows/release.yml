name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: bump
        run: |
          # Extract current version
          CURRENT_VERSION=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' cli/cli.go | head -n 1)
          echo "Current version: $CURRENT_VERSION"
          
          # Strip 'v' prefix
          VERSION_NUM=${CURRENT_VERSION#v}
          
          # Parse version components
          IFS='.' read -r major minor patch <<< "$VERSION_NUM"
          # Increment patch
          new_patch=$((patch + 1))
          NEW_VERSION="v$major.$minor.$new_patch"
          echo "New version: $NEW_VERSION"
          
          # Update version in file
          sed -i "s/$CURRENT_VERSION/$NEW_VERSION/g" cli/cli.go
          
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"
          
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOGS=$(git log --pretty=format:"* %s (%h)" ${PREV_TAG}..HEAD)
          else
            COMMIT_LOGS=$(git log --pretty=format:"* %s (%h)")
          fi
          
          # Write release notes to file
          echo "### Commit History" > release_notes.md
          echo "$COMMIT_LOGS" >> release_notes.md
          
          # Update CHANGELOG.md to insert a header and commit logs for the new patch version
          DATE=$(date +%Y-%m-%d)
          echo -e "\n## [$NEW_VERSION] - $DATE\n\n$COMMIT_LOGS\n" > temp_entry.txt
          sed -i "/# Changelog/r temp_entry.txt" CHANGELOG.md
          rm temp_entry.txt
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch Contributors
        run: |
          # Fetch contributors using curl
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contributors" > contributors.json
          
          # Append contributors header to release notes
          echo -e "\n### Contributors\n" >> release_notes.md
          echo -e "| Avatar | Contributor |" >> release_notes.md
          echo -e "| :---: | :--- |" >> release_notes.md
          
          # Parse contributors and format into Markdown table
          jq -r '.[] | "| <img src=\"\(.avatar_url)\" width=\"35\" height=\"35\" style=\"border-radius:50%\"> | [\(.login)](\(.html_url)) |"' contributors.json >> release_notes.md || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p release
          targets=("darwin/amd64" "darwin/arm64" "linux/amd64" "linux/arm64" "windows/amd64" "windows/386")
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch <<< "$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            
            output_name="vpsm-${goos}-${goarch}"
            echo "Building for $goos/$goarch..."
            
            # Create a temporary staging folder for this target
            mkdir -p "release/$output_name"
            
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "release/$output_name/vpsm$ext" ./cmd/vpsm
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "release/$output_name/vpsmd$ext" ./cmd/vpsmd
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "release/$output_name/vpsm-api$ext" ./cmd/vpsm-api
            
            # Copy shell wrapper to the staging folder
            cp scripts/shell_wrapper.sh "release/$output_name/"
            
            # Compress the binaries
            cd release
            if [ "$goos" = "windows" ]; then
              # For Windows, zip files inside the target folder
              cd "$output_name"
              zip "../${output_name}.zip" *
              cd ..
            else
              # For Unix, tar the files inside the target folder
              tar -czf "${output_name}.tar.gz" -C "$output_name" .
            fi
            rm -rf "$output_name"
            cd ..
          done

      - name: Commit and Push changes
        run: |
          git add cli/cli.go CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin main

      - name: Create Git Tag
        run: |
          git tag ${{ steps.bump.outputs.new_version }}
          git push origin ${{ steps.bump.outputs.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_version }}
          name: Release ${{ steps.bump.outputs.new_version }}
          body_path: release_notes.md
          files: |
            release/*.tar.gz
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
