name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: bump
        run: |
          # Extract current version
          CURRENT_VERSION=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' cmd/vpsm/main.go | head -n 1)
          echo "Current version: $CURRENT_VERSION"
          
          # Strip 'v' prefix
          VERSION_NUM=${CURRENT_VERSION#v}
          
          # Parse version components
          IFS='.' read -r major minor patch <<< "$VERSION_NUM"
          # Increment patch
          new_patch=$((patch + 1))
          NEW_VERSION="v$major.$minor.$new_patch"
          echo "New version: $NEW_VERSION"
          
          # Update version in file
          sed -i "s/$CURRENT_VERSION/$NEW_VERSION/g" cmd/vpsm/main.go
          
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"
          
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOGS=$(git log --pretty=format:"* %s (%h)" ${PREV_TAG}..HEAD)
          else
            COMMIT_LOGS=$(git log --pretty=format:"* %s (%h)")
          fi
          
          # Write release notes to file
          echo "$COMMIT_LOGS" > release_notes.md
          
          # Update CHANGELOG.md to insert a header and commit logs for the new patch version
          DATE=$(date +%Y-%m-%d)
          echo -e "\n## [$NEW_VERSION] - $DATE\n\n$COMMIT_LOGS\n" > temp_entry.txt
          sed -i "/# Changelog/r temp_entry.txt" CHANGELOG.md
          rm temp_entry.txt
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        run: |
          git add cmd/vpsm/main.go CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin main

      - name: Create Git Tag
        run: |
          git tag ${{ steps.bump.outputs.new_version }}
          git push origin ${{ steps.bump.outputs.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_version }}
          name: Release ${{ steps.bump.outputs.new_version }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
