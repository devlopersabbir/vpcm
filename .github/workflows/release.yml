name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Bump patch version, generate release notes, upload artifacts
  # ─────────────────────────────────────────────────────────────
  bump-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      ldflags: ${{ steps.bump.outputs.ldflags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: bump
        run: |
          # ── Single source of truth: internal/version/version.go ──
          # Read current version from the version package (strip quotes and 'v' prefix for math)
          CURRENT_VERSION=$(grep -oP '(?<=Version = ")v[^"]+' internal/version/version.go)
          echo "Current version: $CURRENT_VERSION"

          VERSION_NUM=${CURRENT_VERSION#v}
          IFS='.' read -r major minor patch <<< "$VERSION_NUM"
          new_patch=$((patch + 1))
          NEW_VERSION="v$major.$minor.$new_patch"
          echo "New version: $NEW_VERSION"

          # Update ONLY internal/version/version.go — this is the single source
          sed -i "s|var Version = \".*\"|var Version = \"$NEW_VERSION\"|" internal/version/version.go

          # Build the ldflags string used by ALL go build commands
          LDFLAGS="-s -w -X github.com/devlopersabbir/vpcm/internal/version.Version=$NEW_VERSION"
          echo "ldflags=$LDFLAGS" >> $GITHUB_OUTPUT

          # Generate release notes
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOGS=$(git log --pretty=format:"* %s (%h)" ${PREV_TAG}..HEAD)
          else
            COMMIT_LOGS=$(git log --pretty=format:"* %s (%h)")
          fi

          echo "### Commit History" > release_notes.md
          echo "$COMMIT_LOGS" >> release_notes.md

          DATE=$(date +%Y-%m-%d)
          echo -e "\n## [$NEW_VERSION] - $DATE\n\n$COMMIT_LOGS\n" > temp_entry.txt
          sed -i "/# Changelog/r temp_entry.txt" CHANGELOG.md
          rm temp_entry.txt

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch Contributors
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contributors" > contributors.json
          echo -e "\n### Contributors\n" >> release_notes.md
          echo -e "| Avatar | Contributor |" >> release_notes.md
          echo -e "| :---: | :--- |" >> release_notes.md
          jq -r '.[] | "| <img src=\"\(.avatar_url)\" width=\"35\" height=\"35\" style=\"border-radius:50%\"> | [\(.login)](\(.html_url)) |"' contributors.json >> release_notes.md || true

      - name: Upload Release Info
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: |
            release_notes.md
            internal/version/version.go
            CHANGELOG.md

  # ─────────────────────────────────────────────────────────────
  # 2. Cross-compile CLI binaries for all platforms
  # ─────────────────────────────────────────────────────────────
  build-cli:
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release Info
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: .

      - name: Restore bumped version file
        run: |
          # The bumped version.go was uploaded as an artifact — restore it so
          # the ldflags injection has a consistent file on disk too
          cp version.go internal/version/version.go || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build Cross-Platform CLI Binaries
        env:
          LDFLAGS: ${{ needs.bump-version.outputs.ldflags }}
        run: |
          mkdir -p release
          targets=("darwin/amd64" "darwin/arm64" "linux/amd64" "linux/arm64" "windows/amd64" "windows/386")
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch <<< "$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            output_name="vpsm-${goos}-${goarch}"
            mkdir -p "release/$output_name"
            # Inject version into all three binaries via ldflags
            GOOS=$goos GOARCH=$goarch go build -ldflags="$LDFLAGS" -o "release/$output_name/vpsm$ext" ./cmd/vpsm
            GOOS=$goos GOARCH=$goarch go build -ldflags="$LDFLAGS" -o "release/$output_name/vpsmd$ext" ./cmd/vpsmd
            GOOS=$goos GOARCH=$goarch go build -ldflags="$LDFLAGS" -o "release/$output_name/vpsm-api$ext" ./cmd/vpsm-api
            cp scripts/shell_wrapper.sh "release/$output_name/" || true
            cd release
            if [ "$goos" = "windows" ]; then
              cd "$output_name"
              zip "../${output_name}.zip" *
              cd ..
            else
              tar -czf "${output_name}.tar.gz" -C "$output_name" .
            fi
            rm -rf "$output_name"
            cd ..
          done

      - name: Upload CLI Binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: release/*

  # ─────────────────────────────────────────────────────────────
  # 3. Build Desktop app per OS with proper native installers
  # ─────────────────────────────────────────────────────────────
  build-desktop:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            wails_tags: "-tags webkit2_41"
          - os: macos-latest
            platform: darwin
            wails_tags: ""
          - os: windows-latest
            platform: windows
            wails_tags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Linux dependencies ──────────────────────────────────
      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            nsis \
            libfuse2 \
            wget

      # ── Install Wails ───────────────────────────────────────
      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ── Stamp version into wails.json before building ───────
      # Wails reads info.productVersion to populate:
      #   macOS  → CFBundleVersion & CFBundleShortVersionString in Info.plist
      #   Windows → FileVersion / ProductVersion in .exe metadata + NSIS installer
      # productVersion must be plain semver (no leading 'v'), e.g. "1.1.3"
      - name: Inject Version into wails.json
        shell: bash
        env:
          VERSION: ${{ needs.bump-version.outputs.new_version }}
        run: |
          # Strip the leading 'v' — Wails expects "1.1.3" not "v1.1.3"
          PLAIN_VERSION="${VERSION#v}"
          echo "Setting wails.json productVersion to $PLAIN_VERSION"
          # jq is pre-installed on all GitHub-hosted runners
          jq --arg v "$PLAIN_VERSION" '.info.productVersion = $v' \
            app/vpsm-desktop/wails.json > tmp.json && mv tmp.json app/vpsm-desktop/wails.json
          echo "Updated wails.json:"
          cat app/vpsm-desktop/wails.json | grep productVersion

      # ── Build the Wails app ─────────────────────────────────
      # Wails passes -ldflags to the underlying go build via -ldflags flag.
      # This stamps the version into the desktop binary at compile time.
      - name: Build Wails App (Linux / macOS)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          LDFLAGS: ${{ needs.bump-version.outputs.ldflags }}
          VERSION: ${{ needs.bump-version.outputs.new_version }}
        run: |
          cd app/vpsm-desktop
          # Restore the bumped version.go so wails picks it up via module
          mkdir -p ../../internal/version
          cp ../../internal/version/version.go ../../internal/version/version.go 2>/dev/null || true
          ~/go/bin/wails build ${{ matrix.wails_tags }} -ldflags "$LDFLAGS"

      - name: Build Wails App (Windows — NSIS installer)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          LDFLAGS: ${{ needs.bump-version.outputs.ldflags }}
          VERSION: ${{ needs.bump-version.outputs.new_version }}
        run: |
          cd app/vpsm-desktop
          ~/go/bin/wails build -nsis -ldflags "$LDFLAGS"

      # ══════════════════════════════════════════════════════════
      #  macOS — ad-hoc sign + create DMG
      # ══════════════════════════════════════════════════════════
      - name: Ad-hoc Sign macOS App
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          # Find the .app — Wails may use "vpsm-desktop.app" or "VPSM Desktop.app"
          APP_PATH=$(find app/vpsm-desktop/build/bin -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            ls app/vpsm-desktop/build/bin/
            exit 1
          fi
          echo "Found app: $APP_PATH"
          # Ad-hoc sign — free, no Apple Developer account required.
          # Prevents the "malware" Gatekeeper dialog. Users on strict SIP
          # may still need System Settings → Privacy & Security → Open Anyway
          # on first launch. For notarization, add APPLE_* secrets and use
          # xcrun notarytool submit.
          codesign --deep --force --options runtime --sign - "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"
          # Remove quarantine so the zip does not re-trigger Gatekeeper
          xattr -cr "$APP_PATH" || true
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Create macOS DMG
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          # Install create-dmg (brew available on macos-latest runners)
          brew install create-dmg || true

          APP_PATH="$APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)
          DMG_NAME="vpsm-desktop-mac.dmg"

          mkdir -p dmg-staging
          cp -R "$APP_PATH" dmg-staging/

          create-dmg \
            --volname "VPSM Desktop" \
            --volicon "app/vpsm-desktop/build/appicon.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "$APP_NAME.app" 180 170 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            "$DMG_NAME" \
            dmg-staging/ || {
              # Fallback: plain hdiutil DMG if create-dmg fails
              echo "create-dmg failed, falling back to hdiutil..."
              hdiutil create -volname "VPSM Desktop" \
                -srcfolder dmg-staging \
                -ov -format UDZO \
                "$DMG_NAME"
            }

          mkdir -p dist
          mv "$DMG_NAME" dist/

      # ══════════════════════════════════════════════════════════
      #  Windows — collect NSIS .exe installer
      # ══════════════════════════════════════════════════════════
      - name: Collect Windows Installer
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          # Wails -nsis generates *-installer.exe in build/bin
          INSTALLER=$(find app/vpsm-desktop/build/bin -name "*installer*.exe" | head -n 1)
          if [ -n "$INSTALLER" ]; then
            echo "Found installer: $INSTALLER"
            cp "$INSTALLER" dist/vpsm-desktop-windows-installer.exe
          else
            echo "No NSIS installer found, packaging raw exe..."
            find app/vpsm-desktop/build/bin -name "*.exe" | head -5
            # Fallback zip
            powershell -Command "Compress-Archive -Path app/vpsm-desktop/build/bin/* -DestinationPath dist/vpsm-desktop-windows.zip"
          fi

      # ══════════════════════════════════════════════════════════
      #  Linux — build .deb package + AppImage
      # ══════════════════════════════════════════════════════════
      - name: Build Linux .deb Package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist

          # Locate the built binary
          BIN=$(find app/vpsm-desktop/build/bin -type f -not -name "*.so" | head -n 1)
          echo "Binary: $BIN"

          # Build a minimal .deb structure
          PKG_DIR="vpsm-desktop_amd64"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"

          cp "$BIN" "$PKG_DIR/usr/bin/vpsm-desktop"
          chmod 755 "$PKG_DIR/usr/bin/vpsm-desktop"

          # Copy icon
          cp app/vpsm-desktop/build/appicon.png \
            "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/vpsm-desktop.png" || true

          # .desktop entry
          cat > "$PKG_DIR/usr/share/applications/vpsm-desktop.desktop" <<'EOF'
          [Desktop Entry]
          Name=VPSM Desktop
          Comment=VPS Manager — manage your servers from anywhere
          Exec=/usr/bin/vpsm-desktop
          Icon=vpsm-desktop
          Terminal=false
          Type=Application
          Categories=Development;System;Network;
          StartupNotify=true
          EOF

          # DEBIAN/control
          VERSION="${{ needs.bump-version.outputs.new_version }}"
          VERSION="${VERSION#v}"  # strip leading 'v'
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: vpsm-desktop
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: devlopersabbir <devlopersabbir@gmail.com>
          Description: VPSM Desktop — VPS Manager GUI
           A native desktop GUI for VPSM built with Wails.
           Provides an integrated SSH terminal and server inventory management.
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Homepage: https://github.com/devlopersabbir/vpcm
          EOF

          dpkg-deb --build "$PKG_DIR" dist/vpsm-desktop-linux-amd64.deb
          echo "Created .deb:"
          ls -lh dist/

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          BIN=$(find app/vpsm-desktop/build/bin -type f -not -name "*.so" | head -n 1)

          # Build AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp "$BIN" AppDir/usr/bin/vpsm-desktop
          chmod +x AppDir/usr/bin/vpsm-desktop

          cp app/vpsm-desktop/build/appicon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/vpsm-desktop.png || true
          cp app/vpsm-desktop/build/appicon.png AppDir/vpsm-desktop.png || true

          cat > AppDir/vpsm-desktop.desktop <<'EOF'
          [Desktop Entry]
          Name=VPSM Desktop
          Exec=vpsm-desktop
          Icon=vpsm-desktop
          Type=Application
          Categories=Development;System;
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$APPDIR/usr/bin/vpsm-desktop" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Build AppImage (FUSE not available in CI, use --appimage-extract-and-run)
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run AppDir \
            dist/VPSM-Desktop-x86_64.AppImage || {
            echo "AppImage build failed, skipping."
          }
          ls -lh dist/ || true

      # ── Upload artifacts for all platforms ──────────────────
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.platform }}
          path: dist/*

  # ─────────────────────────────────────────────────────────────
  # 4. Create GitHub Release and attach all installers
  # ─────────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [bump-version, build-cli, build-desktop]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply Version Changes
        run: |
          # Commit only the bumped version.go — single source of truth
          cp dist/release-info/version.go internal/version/version.go || true
          cp dist/release-info/CHANGELOG.md CHANGELOG.md || true
          git add internal/version/version.go CHANGELOG.md
          git commit -m "chore: bump version to ${{ needs.bump-version.outputs.new_version }} [skip ci]" || true
          git push origin main || true

      - name: Create Git Tag
        run: |
          git tag ${{ needs.bump-version.outputs.new_version }}
          git push origin ${{ needs.bump-version.outputs.new_version }}

      - name: Stage Release Files
        run: |
          mkdir -p upload
          # CLI archives
          find dist/cli-binaries -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} upload/ \;
          # macOS DMG
          find dist/desktop-binaries-darwin -type f -name "*.dmg" -exec cp {} upload/ \;
          # Windows NSIS installer + fallback zip
          find dist/desktop-binaries-windows -type f \( -name "*.exe" -o -name "*.zip" \) -exec cp {} upload/ \;
          # Linux .deb + AppImage + fallback tar.gz
          find dist/desktop-binaries-linux -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" \) -exec cp {} upload/ \;
          echo "=== Release assets ==="
          ls -lh upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_version }}
          name: Release ${{ needs.bump-version.outputs.new_version }}
          body_path: dist/release-info/release_notes.md
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
