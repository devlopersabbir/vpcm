name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: bump
        run: |
          CURRENT_VERSION=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' cli/cli.go | head -n 1)
          VERSION_NUM=${CURRENT_VERSION#v}
          IFS='.' read -r major minor patch <<< "$VERSION_NUM"
          new_patch=$((patch + 1))
          NEW_VERSION="v$major.$minor.$new_patch"
          echo "New version: $NEW_VERSION"
          
          sed -i "s/$CURRENT_VERSION/$NEW_VERSION/g" cli/cli.go
          
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOGS=$(git log --pretty=format:"* %s (%h)" ${PREV_TAG}..HEAD)
          else
            COMMIT_LOGS=$(git log --pretty=format:"* %s (%h)")
          fi
          
          echo "### Commit History" > release_notes.md
          echo "$COMMIT_LOGS" >> release_notes.md
          
          DATE=$(date +%Y-%m-%d)
          echo -e "\n## [$NEW_VERSION] - $DATE\n\n$COMMIT_LOGS\n" > temp_entry.txt
          sed -i "/# Changelog/r temp_entry.txt" CHANGELOG.md
          rm temp_entry.txt
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch Contributors
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contributors" > contributors.json
          echo -e "\n### Contributors\n" >> release_notes.md
          echo -e "| Avatar | Contributor |" >> release_notes.md
          echo -e "| :---: | :--- |" >> release_notes.md
          jq -r '.[] | "| <img src=\"\(.avatar_url)\" width=\"35\" height=\"35\" style=\"border-radius:50%\"> | [\(.login)](\(.html_url)) |"' contributors.json >> release_notes.md || true

      - name: Upload Release Info
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: |
            release_notes.md
            cli/cli.go
            CHANGELOG.md

  build-cli:
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release Info
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: .

      - name: Restore bumped files
        run: |
          cp cli.go cli/cli.go || true
          cp CHANGELOG.md CHANGELOG.md || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build Cross-Platform CLI Binaries
        run: |
          mkdir -p release
          targets=("darwin/amd64" "darwin/arm64" "linux/amd64" "linux/arm64" "windows/amd64" "windows/386")
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch <<< "$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            output_name="vpsm-${goos}-${goarch}"
            mkdir -p "release/$output_name"
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "release/$output_name/vpsm$ext" ./cmd/vpsm
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "release/$output_name/vpsmd$ext" ./cmd/vpsmd
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "release/$output_name/vpsm-api$ext" ./cmd/vpsm-api
            cp scripts/shell_wrapper.sh "release/$output_name/"
            cd release
            if [ "$goos" = "windows" ]; then
              cd "$output_name"
              zip "../${output_name}.zip" *
              cd ..
            else
              tar -czf "${output_name}.tar.gz" -C "$output_name" .
            fi
            rm -rf "$output_name"
            cd ..
          done

      - name: Upload CLI Binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: release/*

  build-desktop:
    needs: bump-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential nsis

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        shell: bash
        run: |
          cd app/vpsm-desktop
          ~/go/bin/wails build

      - name: Package Desktop Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            powershell -Command "Compress-Archive -Path app/vpsm-desktop/build/bin/* -DestinationPath dist/vpsm-desktop-windows.zip" || zip -r dist/vpsm-desktop-windows.zip app/vpsm-desktop/build/bin/*
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            cd app/vpsm-desktop/build/bin
            zip -r ../../../dist/vpsm-desktop-mac.zip .
            cd ../../../
          else
            tar -czf dist/vpsm-desktop-linux.tar.gz -C app/vpsm-desktop/build/bin .
          fi

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.platform }}
          path: dist/*

  create-release:
    runs-on: ubuntu-latest
    needs: [bump-version, build-cli, build-desktop]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply Version Changes
        run: |
          cp dist/release-info/cli.go cli/cli.go || true
          cp dist/release-info/CHANGELOG.md CHANGELOG.md || true
          git add cli/cli.go CHANGELOG.md
          git commit -m "chore: bump version to ${{ needs.bump-version.outputs.new_version }} [skip ci]" || true
          git push origin main || true

      - name: Create Git Tag
        run: |
          git tag ${{ needs.bump-version.outputs.new_version }}
          git push origin ${{ needs.bump-version.outputs.new_version }}

      - name: Staging Release Files
        run: |
          mkdir -p upload
          find dist -type f -name "*.tar.gz" -exec cp {} upload/ \;
          find dist -type f -name "*.zip" -exec cp {} upload/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_version }}
          name: Release ${{ needs.bump-version.outputs.new_version }}
          body_path: dist/release-info/release_notes.md
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
